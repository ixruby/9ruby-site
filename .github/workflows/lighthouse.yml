name: Lighthouse Audit

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 6:00 AM UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  lighthouse:
    name: Lighthouse CI Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse audit
        env:
          LHCI_SITE_URL: ${{ vars.SITE_URL || 'https://9ruby.com' }}
        run: |
          lhci autorun \
            --collect.url="$LHCI_SITE_URL" \
            --collect.numberOfRuns=3 \
            --assert.preset=lighthouse:no-pwa \
            --assert.assertions.categories:performance=["error", {"minScore": 0.8}] \
            --assert.assertions.categories:accessibility=["error", {"minScore": 0.8}] \
            --assert.assertions.categories:seo=["error", {"minScore": 0.8}] \
            --assert.assertions.categories:best-practices=["error", {"minScore": 0.8}] \
            --upload.target=temporary-public-storage

      - name: Report results
        if: always()
        run: |
          echo "Lighthouse audit complete."
          echo "Minimum threshold: 80 for Performance, Accessibility, SEO, and Best Practices."
          echo "Results uploaded to temporary public storage - check job logs for the URL."
