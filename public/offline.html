<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Nine Ruby AI</title>
  <meta name="theme-color" content="#C41A3B">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0A0A0A;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 480px;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2.5rem;
    }
    .logo-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #C41A3B;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.5rem;
      color: #fff;
    }
    .logo-text {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: -0.02em;
    }
    .logo-ix {
      font-family: monospace;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.25);
      margin-top: 4px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 500;
      margin-bottom: 1rem;
      color: rgba(255,255,255,0.9);
    }
    p {
      color: rgba(255,255,255,0.5);
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .retry-btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      background: #C41A3B;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .retry-btn:hover { opacity: 0.85; }
    .pulse {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      margin: 2rem auto 0;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="logo-icon">9</div>
      <span class="logo-text">Ruby</span>
      <span class="logo-ix">IX</span>
    </div>
    <h1>You're offline</h1>
    <p>It looks like you've lost your internet connection. Check your network and try again.</p>
    <button class="retry-btn" onclick="window.location.reload()">Retry</button>
    <div class="pulse"></div>
  </div>
</body>
</html>
